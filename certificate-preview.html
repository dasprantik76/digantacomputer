<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificate live preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #e2e8f0; font: 14px system-ui, sans-serif; color: #172b49; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    canvas { display: block; width: min(100%, calc((100vh - 40px) * 3722 / 2480)); height: auto; background: white; box-shadow: 0 8px 32px #172b4926; }
    details { position: fixed; top: 10px; left: 10px; z-index: 1; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 4px 16px #0001; }
    summary { padding: 10px 14px; cursor: pointer; }
    .controls { padding: 0 14px 14px; max-width: 330px; max-height: 75vh; overflow: auto; }
    label { display: grid; gap: 4px; margin: 10px 0; }
    input, button { font: inherit; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
    button { cursor: pointer; background: #eff6ff; }
    button:disabled { opacity: .5; cursor: default; }
    #certCanvasStatus { margin-bottom: 0; }
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      details { display: none; }
      body { background: white; }
      main { display: block; min-height: 0; padding: 0; }
      canvas { width: 100%; box-shadow: none; }
    }
  </style>
</head>
<body>
  <details>
    <summary>Preview controls</summary>
    <div class="controls">
      <p>Edit and save <code>certificate-canvas.js</code> to see placement changes automatically. These are sample details only.</p>
      <form id="sampleData">
        <label>Student name<input name="name" value="Sample Student"></label>
        <label>Father’s name<input name="fatherName" value="Sample Parent"></label>
        <label>Serial number<input name="certificateSerial" value="DEMO-001"></label>
        <label>Issue date<input name="certificateIssueDate" type="date" value="2026-09-08"></label>
        <label>Course<input name="courseTitle" value="Post Graduate Diploma in Computer Applications (PGDCA)"></label>
        <label>Duration<input name="courseDuration" value="1 Year"></label>
        <label>Start date<input name="joinDate" type="date" value="2025-09-01"></label>
        <label>Completion date<input name="completionDate" type="date" value="2026-08-31"></label>
        <label>Grade<input name="grade" value="A+"></label>
      </form>
      <button id="btnPrintCertificate" disabled>Print / Save PDF</button>
      <button id="btnDownloadCertificate" disabled>Download PNG</button>
      <p id="certCanvasStatus" role="status" aria-live="polite"></p>
    </div>
  </details>
  <main>
    <canvas id="certificateCanvas" width="3722" height="2480" role="img" aria-label="Sample certificate preview"></canvas>
  </main>
  <script src="site-config.js?v=5"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="certificate-canvas.js?v=17"></script>
  <script src="certificate-preview.js?v=2"></script>
</body>
</html>
